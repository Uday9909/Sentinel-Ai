name: Bug Report
description: Something broke? Tell us what happened.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. What did you expect vs what actually happened?
      placeholder: "I ran `make setup` and the processing service crashed with 'Connection refused' to Elasticsearch..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What commands did you run? What config?
      placeholder: |
        1. git clone ...
        2. docker-compose up -d
        3. cd ingestion-service && go run main.go
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Go/Python/Node versions, or just paste `docker --version && go version && python3 --version`
      placeholder: "macOS 14, Go 1.25, Python 3.11, Docker 27.0"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste any relevant error messages or logs
      render: shell
    validations:
      required: false
