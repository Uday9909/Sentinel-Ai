name: Feature Request
description: Have an idea? We'd love to hear it.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: "I want to monitor logs from multiple Kafka clusters but Sentinel only supports one broker..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      placeholder: "Add a KAFKA_BROKERS env var that accepts a comma-separated list..."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Any additional context?
      placeholder: "This is common in production where you have separate clusters for different regions..."
    validations:
      required: false
