name: Sentinel AI — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # -----------------------------------------------------------------
  # Lint: Go
  # -----------------------------------------------------------------
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet
        working-directory: ingestion-service
        run: go vet ./...
      - name: gofmt check
        working-directory: ingestion-service
        run: |
          if [ -n "$(gofmt -s -d .)" ]; then
            gofmt -s -d .
            exit 1
          fi

  # -----------------------------------------------------------------
  # Lint: Python
  # -----------------------------------------------------------------
  lint-py:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        working-directory: processing-service
        run: pip install ruff
      - name: ruff check
        working-directory: processing-service
        run: ruff check .

  # -----------------------------------------------------------------
  # Lint: Dashboard
  # -----------------------------------------------------------------
  lint-js:
    name: Lint Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint

  # -----------------------------------------------------------------
  # Go — Ingestion Service
  # -----------------------------------------------------------------
  test-go:
    name: Test Ingestion Service (Go)
    needs: lint-go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: ingestion-service/coverage.out

  # -----------------------------------------------------------------
  # Python — Processing Service
  # -----------------------------------------------------------------
  test-python:
    name: Test Processing Service (Python)
    needs: lint-py
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processing-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: pytest test_processor.py -v --tb=short --cov=processor --cov-report=term

  # -----------------------------------------------------------------
  # Node.js — Dashboard
  # -----------------------------------------------------------------
  test-node:
    name: Test Dashboard (Node.js)
    needs: lint-js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # -----------------------------------------------------------------
  # Integration — K8s Manifests & Dockerfile Validation
  # -----------------------------------------------------------------
  validate-manifests:
    name: Validate K8s Manifests & Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Run manifest validation
        run: pytest tests/integration/ -v --tb=short

      - name: Validate with kubectl (dry-run)
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl apply -k k8s/ --dry-run=client 2>&1 || echo "::warning::kubectl dry-run failed (expected without cluster)"

  # -----------------------------------------------------------------
  # Docker — Build Images (no push)
  # -----------------------------------------------------------------
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-go, test-python, test-node]
    strategy:
      matrix:
        service:
          - { name: ingestion-service, context: ./ingestion-service, health_port: 8080, health_path: /healthz }
          - { name: processing-service, context: ./processing-service, health_port: 8002, health_path: /healthz }
          - { name: dashboard, context: ./dashboard, health_port: 3001, health_path: /api/health }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: false
          tags: sentinel/${{ matrix.service.name }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
