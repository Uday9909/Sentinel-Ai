# Sentinel-Ai CD Pipeline
# Runs on push to main: build + push Docker images to GitHub Container Registry.
#
# Structure:
#   lint*/test* (parallel) ──> build-and-push (matrix, 3 services)
#
name: Sentinel AI — CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.25"
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # -----------------------------------------------------------------
  # Lint: Go
  # -----------------------------------------------------------------
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet
        working-directory: ingestion-service
        run: go vet ./...
      - name: gofmt check
        working-directory: ingestion-service
        run: |
          if [ -n "$(gofmt -s -d .)" ]; then
            gofmt -s -d .
            exit 1
          fi

  # -----------------------------------------------------------------
  # Lint: Python
  # -----------------------------------------------------------------
  lint-py:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        working-directory: processing-service
        run: pip install ruff
      - name: ruff check
        working-directory: processing-service
        run: ruff check .

  # -----------------------------------------------------------------
  # Lint: Dashboard
  # -----------------------------------------------------------------
  lint-js:
    name: Lint Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint

  # -----------------------------------------------------------------
  # Test: Go
  # -----------------------------------------------------------------
  test-go:
    name: Test Go
    needs: lint-go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -v -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: ingestion-service/coverage.out

  # -----------------------------------------------------------------
  # Test: Python
  # -----------------------------------------------------------------
  test-py:
    name: Test Python
    needs: lint-py
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: processing-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests with coverage
        run: pytest -v --cov=processor --cov-report=term test_processor.py

  # -----------------------------------------------------------------
  # Test: Dashboard
  # -----------------------------------------------------------------
  test-js:
    name: Test Dashboard
    needs: lint-js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test

  # -----------------------------------------------------------------
  # Build & Push Docker Images to GHCR
  # -----------------------------------------------------------------
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [test-go, test-py, test-js]
    strategy:
      matrix:
        service:
          - { name: ingestion-service, context: ./ingestion-service }
          - { name: processing-service, context: ./processing-service }
          - { name: dashboard, context: ./dashboard }
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          OWNER="${OWNER@L}"
          BASE="${{ env.REGISTRY }}/${OWNER}/sentinel-${{ matrix.service.name }}"
          echo "tags=${BASE}:${{ github.sha }},${BASE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
