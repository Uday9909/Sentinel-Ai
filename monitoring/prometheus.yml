global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ingestion-service'
    static_configs:
      - targets: ['ingestion-service:8080']

  - job_name: 'processing-service'
    static_configs:
      - targets: ['processing-service:8001']

  # Dashboard has no /metrics endpoint — add prom-client to enable scraping
