# git-cliff configuration for Sentinel-Ai
# https://git-cliff.org/docs/configuration
#
# Regenerates CHANGELOG.md from conventional commits. Run on every push to
# main via .github/workflows/changelog.yml.

[remote.github]
owner = "Uday9909"
repo = "Sentinel-Ai"

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
# One block per release. With no version tags, everything lands under [Unreleased].
body = """
{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | upper_first }}\
{% endmacro -%}

{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}

{% for group, group_commits in commits | group_by(attribute="group") %}
    ### {{ group | trim | upper_first }}
    {% for commit in group_commits %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
{% endfor %}
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
postprocessors = [
  # Link PR/issue references in commit messages.
  { pattern = '<REPO>', replace = "https://github.com/Uday9909/Sentinel-Ai" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
  # Turn "#123" into a link resolved by the postprocessor above.
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))" },
]
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^[Ff]ix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^infra", group = "Changed" },
  { message = "^revert", group = "Removed" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { body = ".*security", group = "Security" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = "beta|alpha"
ignore_tags = "rc"
topo_order = false
sort_commits = "oldest"
