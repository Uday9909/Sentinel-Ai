# ---------------------------------------------------------------------------
# Ingress — Routes external traffic to Sentinel services.
#
# IMPORTANT: This resource requires an Ingress Controller to be installed.
#   - For AWS EKS: AWS Load Balancer Controller (ALB)
#   - For Minikube/bare-metal: NGINX Ingress Controller
#
# Uncomment the annotation block appropriate for your environment.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinel-ingress
  namespace: sentinel
  annotations:
    # --- NGINX Ingress Controller annotations ---
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # nginx.ingress.kubernetes.io/ssl-redirect: "false"

    # --- AWS ALB Ingress Controller annotations ---
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/target-type: ip
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  # Uncomment for NGINX:
  # ingressClassName: nginx
  # Uncomment for ALB:
  # ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 3001
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ingestion-service
                port:
                  number: 8080
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          - path: /prometheus
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
