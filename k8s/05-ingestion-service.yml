# ---------------------------------------------------------------------------
# Ingestion Service — Deployment + Service + HPA
# Go-based HTTP API that receives logs and writes to Kafka.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: sentinel
  labels:
    app: ingestion-service
spec:
  ports:
    - port: 8080
      name: http
  selector:
    app: ingestion-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: sentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      containers:
        - name: ingestion-service
          # PRODUCTION NOTE: Replace with ECR URI, e.g.:
          #   <ACCOUNT_ID>.dkr.ecr.<REGION>.amazonaws.com/sentinel/ingestion-service:latest
          image: sentinel/ingestion-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BROKER
              value: "kafka:9092"
            - name: LISTEN_ADDR
              value: ":8080"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-service-hpa
  namespace: sentinel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
