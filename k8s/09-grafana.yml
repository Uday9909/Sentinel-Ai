# ---------------------------------------------------------------------------
# Grafana — ConfigMaps + Deployment + Service
# Pre-provisioned with Prometheus datasource and Sentinel AI dashboard.
# ---------------------------------------------------------------------------

# --- ConfigMap: Datasource provisioning ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: sentinel
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
# --- ConfigMap: Dashboard provider + dashboard JSON ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: sentinel
data:
  dashboard.yml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards

  sentinel-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "",
                "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line",
                "fillOpacity": 15, "gradientMode": "scheme",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "lineInterpolation": "smooth", "lineWidth": 2, "pointSize": 5,
                "scaleDistribution": { "type": "linear" }, "showPoints": "never",
                "spanNulls": false, "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
              "unit": "ops"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "title": "Log Ingestion Rate",
          "type": "timeseries",
          "targets": [{ "expr": "rate(logs_ingested_total[5m])", "legendFormat": "{{service}} - {{level}}", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "fixedColor": "red", "mode": "fixed" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] },
              "unit": "short"
            }
          },
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "id": 2,
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "title": "Total Anomalies",
          "type": "stat",
          "targets": [{ "expr": "anomalies_detected_total", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "",
                "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line",
                "fillOpacity": 10, "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "lineInterpolation": "smooth", "lineWidth": 2, "pointSize": 5,
                "scaleDistribution": { "type": "linear" }, "showPoints": "never",
                "spanNulls": false, "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
              "unit": "s"
            }
          },
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 },
          "id": 3,
          "title": "Latency p95",
          "type": "timeseries",
          "targets": [
            { "expr": "histogram_quantile(0.95, rate(ingestion_duration_seconds_bucket[5m]))", "legendFormat": "Ingestion p95", "refId": "A" },
            { "expr": "histogram_quantile(0.95, rate(processing_duration_seconds_bucket[5m]))", "legendFormat": "Processing p95", "refId": "B" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "fixedColor": "dark-red", "mode": "fixed" },
              "custom": {
                "axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "",
                "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "bars",
                "fillOpacity": 50, "gradientMode": "none",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5,
                "scaleDistribution": { "type": "linear" }, "showPoints": "never",
                "spanNulls": false, "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
              "unit": "ops"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 4,
          "title": "ES Write Errors",
          "type": "timeseries",
          "targets": [{ "expr": "rate(es_write_errors_total[5m])", "legendFormat": "ES Errors/s", "refId": "A" }]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "",
                "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line",
                "fillOpacity": 15, "gradientMode": "scheme",
                "hideFrom": { "legend": false, "tooltip": false, "viz": false },
                "lineInterpolation": "smooth", "lineWidth": 2, "pointSize": 5,
                "scaleDistribution": { "type": "linear" }, "showPoints": "never",
                "spanNulls": false, "stacking": { "group": "A", "mode": "none" },
                "thresholdsStyle": { "mode": "off" }
              },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
              "unit": "ops"
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 5,
          "title": "Logs Processed Rate",
          "type": "timeseries",
          "targets": [{ "expr": "rate(logs_processed_total[5m])", "legendFormat": "Processed/s", "refId": "A" }]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["sentinel", "observability"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "Sentinel AI Overview",
      "uid": "sentinel-overview",
      "version": 1
    }
---
# --- Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: username
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          # ---------------------------------------------------------------
          # NOTE: Create the grafana-admin Secret before deploying:
          #
          #   kubectl -n sentinel create secret generic grafana-admin \
          #     --from-literal=username=admin \
          #     --from-literal=password=<your-password>
          #
          # For dev-only convenience, you can create it with default creds:
          #
          #   kubectl -n sentinel create secret generic grafana-admin \
          #     --from-literal=username=admin \
          #     --from-literal=password=admin
          # ---------------------------------------------------------------
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              # Only mount dashboard.yml (provider config), not the JSON
            - name: dashboard-json
              mountPath: /var/lib/grafana/dashboards
            - name: grafana-data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          configMap:
            name: grafana-dashboards
            items:
              - key: dashboard.yml
                path: dashboard.yml
        - name: dashboard-json
          configMap:
            name: grafana-dashboards
            items:
              - key: sentinel-dashboard.json
                path: sentinel-dashboard.json
        # PRODUCTION NOTE: Use a PVC for Grafana data persistence
        - name: grafana-data
          emptyDir: {}
---
# --- Service ---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: sentinel
  labels:
    app: grafana
spec:
  ports:
    - port: 3000
      name: http
  selector:
    app: grafana
