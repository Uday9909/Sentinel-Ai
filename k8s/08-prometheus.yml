# ---------------------------------------------------------------------------
# Prometheus — RBAC + ConfigMap + Deployment + Service
# Uses kubernetes_sd_configs for pod discovery within the sentinel namespace.
# ---------------------------------------------------------------------------

# --- ServiceAccount ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: sentinel
---
# --- Role: allows Prometheus to discover pods/services/endpoints ---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: sentinel
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
# --- RoleBinding ---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: sentinel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: sentinel
---
# --- ConfigMap: prometheus.yml adapted for K8s service discovery ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sentinel
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # --- Application services via K8s pod discovery ---
      - job_name: 'ingestion-service'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['sentinel']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: ingestion-service
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:8080

      - job_name: 'processing-service'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['sentinel']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: processing-service
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:8001

      - job_name: 'dashboard'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['sentinel']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: dashboard
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:3001

      # --- Infrastructure (static configs within K8s) ---
      - job_name: 'kafka'
        static_configs:
          - targets: ['kafka:9092']

      - job_name: 'elasticsearch'
        static_configs:
          - targets: ['elasticsearch:9200']
---
# --- Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        # PRODUCTION NOTE: Replace emptyDir with a PVC for data persistence
        - name: data
          emptyDir: {}
---
# --- Service ---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: sentinel
  labels:
    app: prometheus
spec:
  ports:
    - port: 9090
      name: http
  selector:
    app: prometheus
